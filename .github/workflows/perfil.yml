name: Atualizar imagens do perfil

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar linguagens e cards dos projetos
        run: node .github/scripts/perfil.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publicar se algo mudou
        run: |
          git add assets
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Novo ?v= nas imagens força o GitHub a buscar a versão nova em vez da que está em cache.
          sed -i -E "s#(assets/(languages|projetos/[^?\"]+)\.svg\?v=)[0-9a-z]+#\1$(date +%s)#g" README.md
          git add README.md
          git commit -m "Atualiza imagens do perfil"
          git pull --rebase
          git push
