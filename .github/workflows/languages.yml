name: Update Languages SVG

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate languages SVG
        run: node .github/scripts/languages.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git diff --quiet -- assets/languages.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s#(assets/languages\.svg\?v=)[0-9a-z]+#\1$(date +%s)#" README.md
          git add assets/languages.svg README.md
          git commit -m "Atualiza linguagens dos projetos"
          git pull --rebase
          git push
